<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV site — design drafts</title>
    <meta name="robots" content="noindex" />
    <style>
      html {
        background: #1e1f22;
      }
      body {
        margin: 0;
        color: #ececef;
        font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 40px 24px 72px;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        margin: 6px 0 0;
        color: #b4b4bc;
        max-width: 76ch;
      }
      a {
        color: #9ecbff;
      }
      article {
        display: grid;
        grid-template-columns: 1fr 200px;
        gap: 18px;
        padding-top: 24px;
        border-top: 1px solid #34353a;
      }
      article header {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      article h2 {
        margin: 0;
        font-size: 20px;
      }
      img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Design drafts</h1>
        <p>The four directions that were merged into the final site (<a href="../">open the site</a>). Kept for reference; the drafts are not updated.</p>
      </header>
      <article>
        <header><h2>1. Commit Log</h2><a href="1-commit-log/">Open</a></header>
        <img src="../shots/1-commit-log-desktop.png" alt="Commit Log draft on desktop" /><img src="../shots/1-commit-log-mobile.png" alt="Commit Log draft on a phone" />
      </article>
      <article>
        <header><h2>2. Paper</h2><a href="2-paper/">Open</a></header>
        <img src="../shots/2-paper-desktop.png" alt="Paper draft on desktop" /><img src="../shots/2-paper-mobile.png" alt="Paper draft on a phone" />
      </article>
      <article>
        <header><h2>3. Dossier</h2><a href="3-dossier/">Open</a></header>
        <img src="../shots/3-dossier-desktop.png" alt="Dossier draft on desktop" /><img src="../shots/3-dossier-mobile.png" alt="Dossier draft on a phone" />
      </article>
      <article>
        <header><h2>5. Metro</h2><a href="5-metro/">Open</a></header>
        <img src="../shots/5-metro-desktop.png" alt="Metro draft on desktop" /><img src="../shots/5-metro-mobile.png" alt="Metro draft on a phone" />
      </article>
    </main>
  </body>
</html>
